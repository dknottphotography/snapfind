# SnapFind — Render Blueprint (one-click deploy of the full app)
#
# What this does: tells Render to build the repo's Dockerfile (Stage 1 builds the
# Next.js frontend as a static export; Stage 2 runs the Flask API + face AI and
# serves the built site itself, all on one container / one port).
#
# How to use it:
#   1. Copy this file to the root of the snapfind GitHub repo as `render.yaml`.
#   2. Go to dashboard.render.com -> New -> Blueprint -> pick the repo.
#   3. On the free plan the app sleeps after 15 min idle (wakes on visit).
#
# Known free-plan limits (be honest about these):
#   - Filesystem is EPHEMERAL on the free plan: event photos, selfies and the
#     SQLite DB are wiped on every deploy/restart. For real use, upgrade to a
#     paid instance and add a persistent disk mounted at /app/backend/static
#     (plus a second mount at /app/backend/data and DATABASE_URL pointing there).
#   - The free instance has 512 MB RAM; the first boot downloads the ArcFace
#     weights (~a few hundred MB, one-time) which can be slow. If it stalls,
#     switch the service to the Starter plan.

services:
  - type: web
    name: snapfind
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      # Render injects PORT automatically; the Dockerfile's CMD binds to it.
      - key: SERVE_FRONTEND
        value: 1
      - key: SECRET_KEY
        generateValue: true
      # Change after first login; auto-creates the admin account on startup.
      - key: ADMIN_EMAIL
        value: admin@example.com
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: MAX_UPLOAD_MB
        value: 32
